name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: hu553in/common-things/.github/actions/setup-shfmt@main
      - run: bun ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright|${{ runner.os }}|${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright|${{ runner.os }}|
      - run: bun playwright install-deps chromium
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun check:web
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: coverage/lcov.info
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-web-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  swift:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift
            command: check:swift
          - name: Thread Sanitizer
            command: test:sanitize
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: |
          xcodebuild -version
          swift --version
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm|${{ runner.os }}|${{ runner.arch }}|${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm|${{ runner.os }}|${{ runner.arch }}|
      - run: xcodebuild -downloadComponent metalToolchain
      - if: matrix.command == 'check:swift'
        run: brew install swiftlint
      - env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bun "${CHECK_COMMAND}"
      - if: matrix.command == 'check:swift'
        uses: actions/upload-artifact@v7
        with:
          path: dist/Skill-Issue-macos-arm64.zip
          if-no-files-found: error
          archive: false
      - if: always() && matrix.command == 'check:swift'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-swift
          path: coverage/swift/lcov.info
          if-no-files-found: ignore
      - if: failure() && matrix.command == 'check:swift'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-native-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  release:
    needs: [web, swift]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-notes
        uses: hu553in/common-things/.github/actions/release-notes@main
      - uses: actions/download-artifact@v8
        with:
          name: Skill-Issue-macos-arm64.zip
          path: dist
          skip-decompress: true
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.changelog }}
          fail_on_unmatched_files: true
          files: dist/Skill-Issue-macos-arm64.zip

  homebrew:
    name: Homebrew
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.12.1
      - id: git_setup
        uses: Homebrew/actions/git-user-config@2026.10.12.1
      - name: Bump Homebrew cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
        run: |
          : "${HOMEBREW_GITHUB_API_TOKEN:?Set the HOMEBREW_TAP_TOKEN repository secret}"
          brew tap hu553in/tap
          brew trust --cask hu553in/tap/skill-issue
          brew bump --no-fork --open-pr --cask hu553in/tap/skill-issue

      - name: Assign update pull requests
        if: ${{ !cancelled() }}
        env:
          GH_REPO: hu553in/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          pull_requests="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("bump-")) | .number')"
          for pull_request in $pull_requests; do
            gh pr edit "$pull_request" --add-assignee "${GH_REPO%%/*}"
          done
